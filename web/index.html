  <style>
    :root{--nile:#005090;--deep:#003d70;--green:#08783d;--white:#fff}
    html,body{margin:0;width:100%;height:100%;background:var(--nile);font-family:Arial,Helvetica,sans-serif}
    body{overflow:hidden}
    #nile-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:linear-gradient(145deg,#003d70 0%,#005090 52%,#0066a6 100%);color:#fff;transition:opacity .7s ease,visibility .7s ease}
    #nile-loader.done{opacity:0;visibility:hidden;pointer-events:none}
    .loader-scene{position:relative;width:min(390px,88vw);text-align:center}
    .loader-glow{position:absolute;left:50%;top:76px;width:190px;height:190px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.10);filter:blur(18px);animation:nileGlow 3.6s ease-in-out infinite}
    .loader-logo-wrap{position:relative;width:132px;height:132px;margin:0 auto 30px;display:grid;place-items:center}
    .loader-ring{position:absolute;inset:0;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-right-color:#9fe3b5;border-radius:50%;animation:nileSpin 1.8s linear infinite}
    .loader-ring:after{content:"";position:absolute;inset:8px;border:1px solid rgba(159,227,181,.28);border-bottom-color:#fff;border-radius:50%;animation:nileSpinReverse 3s linear infinite}
    .loader-logo{position:relative;width:88px;height:88px;border-radius:50%;object-fit:contain;background:#fff;padding:5px;box-shadow:0 14px 38px rgba(0,0,0,.22)}
    .loader-title{margin:0;color:#fff;font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .loader-subtitle{margin:8px 0 0;color:#dcecf5;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
    .loader-line{width:180px;height:3px;margin:25px auto 0;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
    .loader-line span{display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,#9fe3b5,#fff);animation:nileProgress 2.1s ease-in-out infinite}
    .loader-status{margin:13px 0 0;min-height:17px;color:rgba(255,255,255,.72);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
    .loader-dots:after{content:"";animation:nileDots 1.8s steps(4,end) infinite}
    @keyframes nileSpin{to{transform:rotate(360deg)}}
    @keyframes nileSpinReverse{to{transform:rotate(-360deg)}}
    @keyframes nileGlow{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
    @keyframes nileProgress{0%{transform:translateX(-140%)}100%{transform:translateX(360%)}}
    @keyframes nileDots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
    @media(prefers-reduced-motion:reduce){.loader-ring,.loader-ring:after,.loader-glow,.loader-line span,.loader-dots:after{animation:none}.loader-line span{width:100%}}
  </style>
  <script>
    // Web Push is intentionally disabled. Remove any previously registered
    // Nile Tropical push worker so notifications stay inside the app.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          if (registration.scope.indexOf('/app/push/') !== -1) registration.unregister();
        });
      }).catch(function(){});
    }
  </script>
