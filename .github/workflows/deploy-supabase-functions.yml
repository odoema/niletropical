name: Deploy Supabase Edge Functions
# Production function deployment for Nile Tropical.
# Secrets: SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD

on:
  push:
    branches:
      - master
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ououfhsswyqutcczdtnb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "Supabase project: ${SUPABASE_PROJECT_ID}"

      - name: Apply pending production database migrations safely
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking live migration history before applying anything..."

          # Prefer the raw database password so special characters are encoded
          # safely instead of relying on a manually edited connection URI.
          if [ -n "${SUPABASE_DB_PASSWORD}" ]; then
            export DB_URL="$(
              python3 -c 'import os, urllib.parse; p=os.environ["SUPABASE_DB_PASSWORD"]; print("postgresql://postgres." + os.environ["SUPABASE_PROJECT_ID"] + ":" + urllib.parse.quote(p, safe="") + "@aws-0-eu-central-1.pooler.supabase.com:5432/postgres")'
            )"
            echo "Using Supabase Session Pooler with the GitHub database-password secret."
          elif [ -n "${SUPABASE_DB_URL}" ]; then
            DB_URL="${SUPABASE_DB_URL}"
            echo "Using SUPABASE_DB_URL."
          else
            echo "::error::Neither SUPABASE_DB_PASSWORD nor SUPABASE_DB_URL is configured."
            exit 1
          fi

          echo "Listing live migration history..."
          supabase migration list --db-url "${DB_URL}"

          # The original 001-015 migrations are archived because production
          # was built from that schema outside the current migration history.
          # Migrations 016-024 are legacy order/stock/RPC files and are
          # incompatible with the live production schema (for example, 016
          # expects a payment_method enum that the live production schema does
          # not use). They must be recorded as applied, not executed.
          #
          # migration repair changes ONLY Supabase migration history; it does
          # not execute SQL. This safely baselines already-existing production
          # changes before the dated 2026 migrations are applied.
          LEGACY_VERSIONS=(016 017 018 019 020 021 022 023 024)
          MIGRATION_STATUS="$(supabase migration list --db-url "${DB_URL}")"

          for VERSION in "${LEGACY_VERSIONS[@]}"; do
            if printf "%s\n" "${MIGRATION_STATUS}" | grep -Eq "^.*\|[[:space:]]*\`${VERSION}\`[[:space:]]*\|"; then
              echo "Legacy migration ${VERSION} is already recorded on production."
            else
              echo "Baselining legacy migration ${VERSION} as applied (history only)..."
              supabase migration repair "${VERSION}" --status applied --db-url "${DB_URL}"
            fi
          done

          echo "Migration history after baseline repair:"
          supabase migration list --db-url "${DB_URL}"

          echo "Applying only the dated production migrations..."
          supabase db push --db-url "${DB_URL}"

      - name: Deploy track-order
        run: supabase functions deploy track-order --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy notification-dispatch
        run: supabase functions deploy notification-dispatch --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-initiate
        run: supabase functions deploy payment-initiate --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-status
        run: supabase functions deploy payment-status --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy analytics-dashboard
        run: supabase functions deploy analytics-dashboard --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deployment complete
        run: |
          echo "Nile Tropical tracking, payment and analytics functions deployed successfully."
