name: Deploy Supabase Edge Functions
# Production MTN payment deployment for Nile Tropical.
# IMPORTANT: track-order/notification-dispatch remain on their already-live versions.
# This workflow deploys only the reconciled MTN payment functions.

on:
  push:
    branches:
      - master
    paths:
      - "supabase/functions/payment-initiate/**"
      - "supabase/functions/payment-status/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tyhqwngqxbcivfphgxck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "Supabase project: ${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-initiate
        run: supabase functions deploy payment-initiate --project-ref "${SUPABASE_PROJECT_ID}" --use-api

      - name: Deploy payment-status
        run: supabase functions deploy payment-status --project-ref "${SUPABASE_PROJECT_ID}" --use-api

      - name: Deployment complete
        run: |
          echo "Nile Tropical MTN payment functions deployed."
