name: Deploy Supabase Edge Functions
# Production function deployment for Nile Tropical.
# Secret configured: SUPABASE_ACCESS_TOKEN

on:
  push:
    branches:
      - master
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ououfhsswyqutcczdtnb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub Actions secrets."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Supabase project: ${SUPABASE_PROJECT_ID}"

      - name: Apply pending production database migrations safely
        run: |
          echo "Checking live migration history before applying anything..."
          if [ -n "${SUPABASE_DB_URL}" ]; then
            DB_URL="${SUPABASE_DB_URL}"
          elif [ -n "${SUPABASE_DB_PASSWORD}" ]; then
            DB_URL="postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/postgres?sslmode=require"
          else
            echo "::error::Neither SUPABASE_DB_URL nor SUPABASE_DB_PASSWORD is configured."
            echo "The GitHub Supabase access token cannot perform database migration operations with its current permissions."
            exit 1
          fi

          echo "Listing live migration history..."
          supabase migration list --db-url "${DB_URL}"
          echo "Applying only migrations not already recorded on the live project..."
          supabase db push --db-url "${DB_URL}"

      - name: Deploy track-order
        run: supabase functions deploy track-order --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy notification-dispatch
        run: supabase functions deploy notification-dispatch --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-initiate
        run: supabase functions deploy payment-initiate --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-status
        run: supabase functions deploy payment-status --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy analytics-dashboard
        run: supabase functions deploy analytics-dashboard --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deployment complete
        run: |
          echo "Nile Tropical tracking, payment and analytics functions deployed successfully."
