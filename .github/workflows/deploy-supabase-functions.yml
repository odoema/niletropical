name: Deploy Supabase Edge Functions
# Production MTN payment deployment for Nile Tropical.
# IMPORTANT: track-order/notification-dispatch remain on their already-live versions.
# This workflow deploys only the reconciled MTN payment functions.
#
# The CLI's deploy path first lists functions. Our existing deployment token is
# intentionally write-capable but does not have edge_functions_read, so use the
# Supabase Management API write endpoints directly. This avoids changing the
# existing token or reconfiguring the MTN integration.

on:
  push:
    branches:
      - master
    paths:
      - "supabase/functions/payment-initiate/**"
      - "supabase/functions/payment-status/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tyhqwngqxbcivfphgxck
      SUPABASE_API_URL: https://api.supabase.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "Supabase project: ${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-initiate
        shell: bash
        run: |
          set -euo pipefail
          body_json="$(jq -n --rawfile body supabase/functions/payment-initiate/index.ts '{body: $body}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "${SUPABASE_API_URL}/v1/projects/${SUPABASE_PROJECT_ID}/functions/payment-initiate" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${body_json}"
          echo "payment-initiate deployed."

      - name: Deploy payment-status
        shell: bash
        run: |
          set -euo pipefail
          body_json="$(jq -n --rawfile body supabase/functions/payment-status/index.ts '{body: $body}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "${SUPABASE_API_URL}/v1/projects/${SUPABASE_PROJECT_ID}/functions/payment-status" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${body_json}"
          echo "payment-status deployed."

      - name: Deployment complete
        run: |
          echo "Nile Tropical MTN payment functions deployed."
