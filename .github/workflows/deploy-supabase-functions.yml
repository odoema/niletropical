name: Deploy Supabase Edge Functions
# Production function deployment for Nile Tropical.
# Secret configured: SUPABASE_ACCESS_TOKEN

on:
  push:
    branches:
      - master
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ououfhsswyqutcczdtnb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing from GitHub Actions secrets."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Supabase project: ${SUPABASE_PROJECT_ID}"

      - name: Deploy track-order
        run: supabase functions deploy track-order --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-initiate
        run: supabase functions deploy payment-initiate --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deploy payment-status
        run: supabase functions deploy payment-status --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Deployment complete
        run: |
          echo "Nile Tropical tracking and payment functions deployed successfully."
