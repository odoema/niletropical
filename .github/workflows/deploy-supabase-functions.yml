name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - master
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ououfhsswyqutcczdtnb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Supabase credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy payment-initiate
        run: npx --yes supabase@latest functions deploy payment-initiate --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy payment-status
        run: npx --yes supabase@latest functions deploy payment-status --project-ref "$SUPABASE_PROJECT_REF"
