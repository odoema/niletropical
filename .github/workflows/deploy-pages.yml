# Production deployment workflow — verified after Publishing Studio merge
name: Deploy Nile Tropical Website + Flutter App

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Validate production Supabase target
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="https://ououfhsswyqutcczdtnb.supabase.co"
          if [ "${SUPABASE_URL}" != "${EXPECTED}" ]; then
            echo "::error::SUPABASE_URL is not pointing to the current Nile Tropical Supabase project."
            echo "::error::Expected ${EXPECTED}"
            exit 1
          fi
          echo "Production Supabase target verified: ${EXPECTED}"

      - name: Verify public published Articles feed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/"
          anon = os.environ["SUPABASE_ANON_KEY"]
          service = os.environ["SUPABASE_SERVICE_ROLE_KEY"]

          def get(path, key):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "apikey": key,
                      "Authorization": "Bearer " + key,
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as res:
                  return json.load(res)

          # The production publishing_items schema uses published_at as its
          # publication flag. Do not rely on status/embargo_until columns.
          source_rows = get(
              "publishing_items?select=id,published_at"
              "&content_type=eq.news_story"
              "&published_at=not.is.null"
              "&limit=10000",
              service,
          )
          public_rows = get(
              "published_articles?select=id,content_type"
              "&content_type=eq.news_story"
              "&limit=10000",
              anon,
          )

          expected = {row["id"] for row in source_rows if row.get("published_at")}
          actual = {row["id"] for row in public_rows}

          print(f"Production published news_story source rows: {len(expected)}")
          print(f"Public published_articles news_story rows: {len(actual)}")

          missing = sorted(expected - actual)
          extra = sorted(actual - expected)

          if missing:
              print(
                  "::error::Published Articles missing from public feed: "
                  + ",".join(missing[:50])
              )
              raise SystemExit(1)

          if extra:
              print(
                  "::error::Public Articles feed contains rows that are not "
                  "published news_story items: "
                  + ",".join(extra[:50])
              )
              raise SystemExit(1)

          if not expected:
              print("::warning::No published news_story rows currently exist.")
          else:
              print(
                  "Published Articles public-feed contract verified: "
                  "every published news_story is publicly readable."
              )
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze lib test --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Use the official Nile Tropical logo for web branding
        run: |
          cp assets/images/logo.png web/favicon.png

      - name: Generate Web Push public configuration
        run: |
          node scripts/generate_vapid_public.mjs > web/vapid-public.json

      - name: Build Flutter commerce app
        run: |
          flutter build web --release             --dart-define=APP_ENV=production             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Convert Flutter build to portable relative base path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path("build/web/index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace('<base href="/">', '<base href="./">')
          index.write_text(text, encoding="utf-8")
          PY

      - name: Generate public CMS configuration
        run: |
          mkdir -p assets/website
          cat > assets/website/cms-config.js <<EOF
          window.NILE_CMS = {
            url: "${SUPABASE_URL}",
            anonKey: "${SUPABASE_ANON_KEY}"
          };
          EOF

      - name: Assemble public website and Flutter app
        run: |
          rm -rf build/site
          mkdir -p build/site/app
          cp index.html build/site/index.html
          cp articles.html build/site/articles.html
          cp privacy.html build/site/privacy.html
          cp terms.html build/site/terms.html
          cp CNAME build/site/CNAME
          mkdir -p build/site/assets/website
          cp -R assets/website/. build/site/assets/website/
          cp -R build/web/. build/site/app/

      - name: Verify Pages artifact
        run: |
          test -f build/site/index.html
          test -f build/site/app/index.html
          test -f build/site/articles.html
          test -f build/site/CNAME
          echo "Pages artifact verified: website + Flutter app + Publishing newsroom present."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  record-deployment:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record deployment outcome and failed stage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          run_id=int(os.environ["GITHUB_RUN_ID"])
          api=f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          req=urllib.request.Request(api,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          jobs=json.load(urllib.request.urlopen(req))
          failed=[]
          for j in jobs.get("jobs",[]):
              if j.get("conclusion")=="failure":
                  step=next((s for s in reversed(j.get("steps",[])) if s.get("conclusion")=="failure"),None)
                  failed.append((j.get("name"), step.get("name") if step else None))
          failed_job,failed_step=(failed[0] if failed else (None,None))
          s=(failed_step or "")+" "+(failed_job or "")
          category="UNCLASSIFIED"
          if "Analyze Flutter code" in s: category="CODE_ANALYSIS"
          elif "Run Flutter tests" in s: category="TEST_FAILURE"
          elif "Build Flutter commerce app" in s: category="FLUTTER_WEB_BUILD"
          elif "Validate production Supabase target" in s: category="ENVIRONMENT_CONFIGURATION"
          elif "Verify Pages artifact" in s: category="PUBLIC_FEED_CONTRACT"
          elif "Verify Pages artifact" in s: category="ARTIFACT_ASSEMBLY"
          elif "Upload Pages artifact" in s or "Deploy to GitHub Pages" in s: category="DEPLOYMENT_PROVIDER"
          payload={
            "provider":"github_actions","repository":repo,"workflow_name":os.environ["GITHUB_WORKFLOW"],
            "run_id":run_id,"run_number":int(os.environ["GITHUB_RUN_NUMBER"]),
            "commit_sha":os.environ["GITHUB_SHA"],"branch":os.environ["GITHUB_REF_NAME"],
            "event_name":os.environ["GITHUB_EVENT_NAME"],"attempt":int(os.environ.get("GITHUB_RUN_ATTEMPT","1")),
            "status":"completed","conclusion":("failure" if os.environ["BUILD_RESULT"]=="failure" or os.environ["DEPLOY_RESULT"]=="failure" else "success"),
            "failed_job":failed_job,"failed_step":failed_step,
            "root_cause_category":category,
            "run_url":f"https://github.com/{repo}/actions/runs/{run_id}",
            "evidence_url":f"https://github.com/{repo}/actions/runs/{run_id}",
            "evidence":{"build_result":os.environ["BUILD_RESULT"],"deploy_result":os.environ["DEPLOY_RESULT"],"failed_jobs":failed},
            "detection_stage":failed_step or ("deploy" if os.environ["DEPLOY_RESULT"]!="success" else "none"),
            "evidence_confidence":"confirmed" if failed else "unclassified",
            "recurrence_key":category
          }
          base=os.environ["SUPABASE_URL"]+"/rest/v1/"
          headers={"Authorization":"Bearer "+os.environ["SUPABASE_SERVICE_ROLE_KEY"],"apikey":os.environ["SUPABASE_SERVICE_ROLE_KEY"],"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"}
          if failed:
              req=urllib.request.Request(base+"deployment_failure_records",data=json.dumps(payload).encode(),headers=headers,method="POST")
              urllib.request.urlopen(req,timeout=10).read()
          run_payload={k:payload[k] for k in ["provider","repository","workflow_name","run_id","run_number","commit_sha","branch","event_name","attempt","status","conclusion","run_url"] if k in payload}
          req=urllib.request.Request(base+"deployment_run_records",data=json.dumps(run_payload).encode(),headers=headers,method="POST")
          urllib.request.urlopen(req,timeout=10).read()
          PY
