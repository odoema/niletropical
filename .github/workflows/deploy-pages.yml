name: Deploy Nile Tropical Website + Flutter App

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter commerce app
        run: |
          flutter build web --release             --dart-define=APP_ENV=production             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Convert Flutter build to portable relative base path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path("build/web/index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace('<base href="/">', '<base href="./">')
          index.write_text(text, encoding="utf-8")
          PY

      - name: Generate public CMS configuration
        run: |
          mkdir -p assets/website
          cat > assets/website/cms-config.js <<EOF
          window.NILE_CMS = {
            url: "${SUPABASE_URL}",
            anonKey: "${SUPABASE_ANON_KEY}"
          };
          EOF

      - name: Assemble public website and Flutter app
        run: |
          rm -rf build/site
          mkdir -p build/site/app
          cp index.html build/site/index.html
          cp CNAME build/site/CNAME
          mkdir -p build/site/assets/website
          cp -R assets/website/. build/site/assets/website/
          cp -R build/web/. build/site/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
