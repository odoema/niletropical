name: Sync Nile Tropical Catalogue

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/upload-product-images.yml'
      - 'assets/products/product-image-mapping.json'
      - 'assets/products/catalog-copy.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRIVE_FOLDER_URL: https://drive.google.com/drive/folders/1nO6wELJBZvr9I302bMyRTWccFOQxpvcm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is missing."; exit 1; }

      - name: Download original product photographs from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet gdown
          rm -rf /tmp/nile-drive
          mkdir -p /tmp/nile-drive
          gdown --folder "$DRIVE_FOLDER_URL" -O /tmp/nile-drive
          count="$(find /tmp/nile-drive -type f -iname '*.jpg' -o -iname '*.jpeg' | wc -l)"
          echo "Downloaded $count JPEG photographs."
          test "$count" -ge 20 || {
            echo "::error::Google Drive folder did not expose the expected photograph set. Ensure the folder is shared as Anyone with the link / Viewer."
            exit 1
          }

      - name: Verify the high-confidence photo matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nile-matched

          declare -A MAP=(
            [nile-sheabutter-lotion-apple-200ml]="Nile products Edits-23.jpg"
            [nile-sheabutter-lotion-lavender-200ml]="Nile products Edits-29.jpg"
            [nile-sheabutter-lotion-lemon-200ml]="Nile products Edits-25.jpg"
            [shea-butter-mosquito-repellent-jelly-150g]="Nile products Edits-78.jpg"
            [sheabutter-facial-scrub-soap-120g]="Nile products Edits-98.jpg"
            [tropisun-sunscreen-for-albinism-200g]="Nile products Edits-17.jpg"
            [hibiscus-powder-150g]="Nile products Edits-63.jpg"
            [eco-shea-butter]="Nile products Edits-61.jpg"
            [eco-shea-butter-250g]="Nile products Edits-52.jpg"
            [eco-shea-butter-500g]="Nile products Edits-55.jpg"
          )

          for slug in "${!MAP[@]}"; do
            wanted="${MAP[$slug]}"
            found="$(find /tmp/nile-drive -type f -iname "$wanted" | head -n 1 || true)"
            if [ -z "$found" ]; then
              echo "::error::Mapped original photograph not found in Drive: $wanted"
              exit 1
            fi
            cp "$found" "/tmp/nile-matched/$slug.jpg"
            echo "$slug <- $wanted"
          done

      - name: Update catalogue copy and verified real images in Supabase
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Updating product copy ==="
          jq -r 'to_entries[] | [.key, .value.name, .value.description] | @tsv' assets/products/catalog-copy.json |
          while IFS=$'\t' read -r slug name description; do
            product_id="$(curl --fail-with-body --silent --show-error               "$SUPABASE_URL/rest/v1/products?select=id&slug=eq.$slug&limit=1"               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" |
              jq -r '.[0].id // empty')"

            if [ -z "$product_id" ]; then
              echo "::warning::Product slug not found in production: $slug"
              continue
            fi

            jq -n --arg name "$name" --arg description "$description"               '{name:$name,short_description:$description,full_description:$description}' |
              curl --fail-with-body --silent --show-error                 "$SUPABASE_URL/rest/v1/products?id=eq.$product_id"                 -X PATCH                 -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"                 -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"                 -H "Content-Type: application/json"                 -H "Prefer: return=minimal"                 -d @-

            echo "Updated copy: $slug"
          done

          echo "=== Uploading verified original photographs ==="
          for file in /tmp/nile-matched/*.jpg; do
            slug="$(basename "$file" .jpg)"

            product_id="$(curl --fail-with-body --silent --show-error               "$SUPABASE_URL/rest/v1/products?select=id&slug=eq.$slug&limit=1"               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" |
              jq -r '.[0].id // empty')"

            if [ -z "$product_id" ]; then
              echo "::error::Production product not found for verified image slug: $slug"
              exit 1
            fi

            curl --fail-with-body --silent --show-error               -X PUT "$SUPABASE_URL/storage/v1/object/product-images/$slug.jpg"               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"               -H "Content-Type: image/jpeg"               -H "x-upsert: true"               --data-binary "@$file"

            payload="$(jq -n               --arg path "$slug.jpg"               --arg alt "$slug — original Nile Tropical product photograph"               '{storage_path:$path,alt_text:$alt,is_main:true,sort_order:0}')"

            updated="$(curl --fail-with-body --silent --show-error               "$SUPABASE_URL/rest/v1/product_images?product_id=eq.$product_id&is_main=eq.true"               -X PATCH               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"               -H "Content-Type: application/json"               -H "Prefer: return=representation"               -d "$payload")"

            if [ "$(echo "$updated" | jq 'length')" -eq 0 ]; then
              jq -n                 --arg product_id "$product_id"                 --arg path "$slug.jpg"                 --arg alt "$slug — original Nile Tropical product photograph"                 '{product_id:$product_id,storage_path:$path,alt_text:$alt,is_main:true,sort_order:0}' |
                curl --fail-with-body --silent --show-error                   "$SUPABASE_URL/rest/v1/product_images"                   -X POST                   -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"                   -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"                   -H "Content-Type: application/json"                   -H "Prefer: return=minimal"                   -d @-
            fi

            echo "Uploaded real image: $slug.jpg"
          done

      - name: Verify the synchronized real images are reachable
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/nile-matched/*.jpg; do
            slug="$(basename "$file" .jpg)"
            curl --fail-with-body --silent --show-error --head               "$SUPABASE_URL/storage/v1/object/public/product-images/$slug.jpg" >/dev/null
            echo "VERIFIED: $slug.jpg"
          done
          echo "Catalogue copy + verified original product photographs are now synchronized."
