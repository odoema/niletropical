name: Upload Nile Tropical Product Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is missing."; exit 1; }

      - name: Install SVG renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          command -v convert
          command -v rsvg-convert

      - name: Prepare product JPGs from the 20 committed product artworks
        shell: bash
        run: |
          set -euo pipefail

          svg_count="$(find assets/products -maxdepth 1 -type f -name '*.svg' | wc -l)"
          test "$svg_count" -eq 20 || {
            echo "::error::Expected exactly 20 product SVG artworks, found $svg_count."
            exit 1
          }

          rm -rf assets/generated-products
          mkdir -p assets/generated-products

          for svg in assets/products/*.svg; do
            slug="$(basename "$svg" .svg)"
            echo "Rendering $slug.jpg"
            rsvg-convert -w 1200 -h 1200 "$svg" -o "assets/generated-products/$slug.png"
            convert "assets/generated-products/$slug.png" -background white -alpha remove -alpha off -strip -interlace Plane -quality 88 "assets/generated-products/$slug.jpg"
            rm "assets/generated-products/$slug.png"
          done

          jpg_count="$(find assets/generated-products -maxdepth 1 -type f -name '*.jpg' | wc -l)"
          test "$jpg_count" -eq 20 || {
            echo "::error::Expected 20 rendered JPGs, found $jpg_count."
            exit 1
          }

          echo "Prepared $jpg_count JPGs from the exact 20 committed production slugs."

      - name: Upload JPGs and attach them to the matching production products
        shell: bash
        run: |
          set -euo pipefail

          for file in assets/generated-products/*.jpg; do
            slug="$(basename "$file" .jpg)"
            echo "=== $slug ==="

            product_id="$(curl --fail-with-body --silent --show-error               "$SUPABASE_URL/rest/v1/products?select=id&slug=eq.$slug&limit=1"               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"               | jq -r '.[0].id // empty')"

            if [ -z "$product_id" ]; then
              echo "::error::Production product not found for slug: $slug"
              exit 1
            fi

            curl --fail-with-body --silent --show-error               -X PUT "$SUPABASE_URL/storage/v1/object/product-images/$slug.jpg"               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"               -H "Content-Type: image/jpeg"               -H "x-upsert: true"               --data-binary "@$file"

            payload="$(jq -n               --arg path "$slug.jpg"               --arg alt "$slug product image"               '{storage_path:$path,alt_text:$alt,is_main:true,sort_order:0}')"

            updated="$(curl --fail-with-body --silent --show-error               "$SUPABASE_URL/rest/v1/product_images?product_id=eq.$product_id&is_main=eq.true"               -X PATCH               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"               -H "Content-Type: application/json"               -H "Prefer: return=representation"               -d "$payload")"

            if [ "$(echo "$updated" | jq 'length')" -eq 0 ]; then
              jq -n                 --arg product_id "$product_id"                 --arg path "$slug.jpg"                 --arg alt "$slug product image"                 '{product_id:$product_id,storage_path:$path,alt_text:$alt,is_main:true,sort_order:0}'                 | curl --fail-with-body --silent --show-error                     "$SUPABASE_URL/rest/v1/product_images"                     -X POST                     -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"                     -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"                     -H "Content-Type: application/json"                     -H "Prefer: return=minimal"                     -d @-
            fi

            echo "Uploaded and attached $slug.jpg -> $product_id"
          done

      - name: Verify all 20 product images in Storage and database
        shell: bash
        run: |
          set -euo pipefail

          expected=0
          while IFS= read -r file; do
            slug="$(basename "$file" .jpg)"
            expected=$((expected + 1))

            curl --fail-with-body --silent --show-error --head               "$SUPABASE_URL/storage/v1/object/public/product-images/$slug.jpg" >/dev/null

            echo "Verified storage object: $slug.jpg"
          done < <(find assets/generated-products -maxdepth 1 -type f -name '*.jpg' | sort)

          test "$expected" -eq 20 || {
            echo "::error::Expected 20 generated JPGs for verification, found $expected."
            exit 1
          }

          image_ref_count="$(curl --fail-with-body --silent --show-error             "$SUPABASE_URL/rest/v1/product_images?select=id,storage_path,is_main&storage_path=like.*.jpg&is_main=eq.true"             -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"             | jq 'length')"

          test "$image_ref_count" -ge 20 || {
            echo "::error::Expected at least 20 main JPG image references, found $image_ref_count."
            exit 1
          }

          echo "VERIFIED: all 20 expected JPG storage objects are reachable and $image_ref_count main JPG references are present."
          echo "The committed SVG artworks were only the source; no SVG placeholder was uploaded to Supabase."
