name: Temporary Nile Tropical Backend Audit

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ououfhsswyqutcczdtnb
    steps:
      - name: Checkout Nile Tropical
        uses: actions/checkout@v4

      - name: Audit live Supabase and frontend references
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          echo "=== LIVE POSTGREST OPENAPI ==="
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          fi
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -o /tmp/openapi.json
          node -e '
            const x=require("/tmp/openapi.json");
            const defs=x.definitions||{};
            console.log("LIVE EXPOSED OBJECTS:");
            console.log(Object.keys(defs).sort().join("\\n"));
            for (const [k,v] of Object.entries(defs).sort()) {
              const p=v.properties||{};
              console.log("\\n## "+k);
              console.log(Object.keys(p).sort().join(", "));
            }
          '

          echo "=== FRONTEND TABLE REFERENCES ==="
          grep -RhoE "\\.from\(['\"][A-Za-z0-9_]+" lib web-store 2>/dev/null \
            | sed -E "s/.*from\(['\"]//" | sort -u || true

          echo "=== FRONTEND RPC REFERENCES ==="
          grep -RhoE "\\.rpc\(['\"][A-Za-z0-9_]+" lib web-store 2>/dev/null \
            | sed -E "s/.*rpc\(['\"]//" | sort -u || true

          echo "=== FRONTEND EDGE FUNCTION REFERENCES ==="
          grep -RhoE "functions\\.invoke\(['\"][A-Za-z0-9_-]+" lib web-store 2>/dev/null \
            | sed -E "s/.*invoke\(['\"]//" | sort -u || true

          echo "=== LIVE BACKEND AUDIT JSON ==="
          cat /tmp/live_backend.json
