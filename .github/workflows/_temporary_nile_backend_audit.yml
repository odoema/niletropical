name: Temporary Nile Tropical Backend Audit

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ououfhsswyqutcczdtnb
    steps:
      - name: Checkout Nile Tropical
        uses: actions/checkout@v4

      - name: Audit live Supabase and frontend references
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          cat > /tmp/audit.mjs <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const endpoint = `https://api.supabase.com/v1/projects/${ref}/database/query/read-only`;

          async function sql(query) {
            const r = await fetch(endpoint, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ query }),
            });
            const body = await r.text();
            if (!r.ok) throw new Error(`Supabase SQL ${r.status}: ${body}`);
            return JSON.parse(body);
          }

          const queries = {
            tables: `
              select table_schema, table_name, table_type
              from information_schema.tables
              where table_schema in ('public')
              order by table_name
            `,
            columns: `
              select table_name, column_name, data_type, is_nullable
              from information_schema.columns
              where table_schema='public'
              order by table_name, ordinal_position
            `,
            routines: `
              select routine_name, routine_type, data_type
              from information_schema.routines
              where routine_schema='public'
              order by routine_name
            `,
            triggers: `
              select event_object_table as table_name, trigger_name,
                     event_manipulation, action_timing, action_statement
              from information_schema.triggers
              where trigger_schema='public'
              order by event_object_table, trigger_name
            `,
            policies: `
              select schemaname, tablename, policyname, permissive,
                     roles, cmd, qual, with_check
              from pg_policies
              where schemaname='public'
              order by tablename, policyname
            `,
            rls: `
              select n.nspname as schema_name, c.relname as table_name,
                     c.relrowsecurity as rls_enabled,
                     c.relforcerowsecurity as rls_forced
              from pg_class c
              join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relkind in ('r','p','v','m')
              order by c.relname
            `,
            foreign_keys: `
              select tc.table_name, kcu.column_name,
                     ccu.table_name as foreign_table_name,
                     ccu.column_name as foreign_column_name,
                     tc.constraint_name
              from information_schema.table_constraints tc
              join information_schema.key_column_usage kcu
                on tc.constraint_name=kcu.constraint_name
               and tc.table_schema=kcu.table_schema
              join information_schema.constraint_column_usage ccu
                on ccu.constraint_name=tc.constraint_name
               and ccu.table_schema=tc.table_schema
              where tc.constraint_type='FOREIGN KEY'
                and tc.table_schema='public'
              order by tc.table_name, tc.constraint_name
            `,
            extensions: `
              select extname, extversion from pg_extension order by extname
            `,
          };

          const out = {};
          for (const [name, query] of Object.entries(queries)) {
            out[name] = await sql(query);
          }
          console.log('=== NILE TROPICAL LIVE SUPABASE AUDIT ===');
          console.log(JSON.stringify(out, null, 2));
          NODE

          node /tmp/audit.mjs > /tmp/live_backend.json

          echo "=== FRONTEND TABLE REFERENCES ==="
          grep -RhoE "\\.from\(['\"][A-Za-z0-9_]+" lib web-store 2>/dev/null \
            | sed -E "s/.*from\(['\"]//" | sort -u || true

          echo "=== FRONTEND RPC REFERENCES ==="
          grep -RhoE "\\.rpc\(['\"][A-Za-z0-9_]+" lib web-store 2>/dev/null \
            | sed -E "s/.*rpc\(['\"]//" | sort -u || true

          echo "=== FRONTEND EDGE FUNCTION REFERENCES ==="
          grep -RhoE "functions\\.invoke\(['\"][A-Za-z0-9_-]+" lib web-store 2>/dev/null \
            | sed -E "s/.*invoke\(['\"]//" | sort -u || true

          echo "=== LIVE BACKEND AUDIT JSON ==="
          cat /tmp/live_backend.json
